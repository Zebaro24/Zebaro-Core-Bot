services:
  zebaro-core-db:
    image: mongo:4.4
    container_name: zebaro-core-db
    restart: "no"
    environment:
      - MONGO_INITDB_DATABASE=zebaro_core
    volumes:
      - ./mongo_db:/data/db
    expose:
      - "27017"
    healthcheck:
      test: [ "CMD-SHELL", "mongo --quiet --eval 'db.adminCommand({ ping: 1 })' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  zebaro-core-playwright:
    # Версия должна совпадать с Python-пакетом playwright из poetry.lock (major.minor),
    # иначе клиент получает 428 "Playwright version mismatch". Проверяется тестом
    # tests/test_playwright_version.py.
    image: mcr.microsoft.com/playwright:v1.59.0-noble
    container_name: zebaro-core-playwright
    restart: "no"
    command: npx playwright@1.59.0 run-server --port 9222
    expose:
      - "9222"

  zebaro-core-bot:
    build: .
    image: ghcr.io/zebaro24/zebaro-core-bot:latest
    container_name: zebaro-core-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_ADMIN_ID
      - TELEGRAM_DOCKER_ACCESS_IDS
      - DISCORD_BOT_TOKEN
      - MONGO_URI=mongodb://zebaro-core-db:27017/zebaro_core
      - PLAYWRIGHT_WS_ENDPOINT=ws://zebaro-core-playwright:9222
      - PERSONAL_GITHUB_TOKEN
      - PERSONAL_GITHUB_SECRET
      - WEBHOOK_URL
      - JOB_STATS_API_TOKEN
      - SITE_CONTACT_TOKEN
      - WG_EASY_PASSWORD=${WG_PASSWORD:-}
      - HOME_PROXY_URL
      - TZ=Europe/Berlin
      - SERVICES_STATE_FILE=/app/state/services.json
    # API wg-easy живёт в сети хоста на мосту Docker (172.17.0.1) — отсюда он host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Монтируем папку, а не сам файл: если services.json на хосте ещё нет,
      # Docker создаёт на его месте директорию и состояние перестаёт сохраняться.
      - ./state:/app/state
    ports:
      - "${SERVER_PORT:-8000}:8000"

  zebaro-core-vpn:
    # WireGuard с веб-API; бот управляет им через /vpn (src/services/vpn/).
    # Сеть хоста: 10.0.0.1 — это сам сервер, поэтому через VPN видны Samba (\\10.0.0.1) и
    # домашний ПК 10.0.0.2. Панель слушает только мост Docker (172.17.0.1:51821): из интернета
    # её не видно, а людям в VPN её закрывает правило на wg0, которое бот сам добавляет в хуки
    # wg-easy (WgEasy.close_panel_to_peers). Наружу открыт только UDP 51820.
    image: ghcr.io/wg-easy/wg-easy:15.4
    container_name: zebaro-core-vpn
    restart: unless-stopped
    network_mode: host
    environment:
      # Только при первом запуске, пока в ./vpn пусто; дальше настройки живут в базе wg-easy.
      - INIT_ENABLED=true
      - INIT_USERNAME=zebaro
      - INIT_PASSWORD=${WG_PASSWORD:?WG_PASSWORD is required}
      - INIT_HOST=${WG_HOST:-server.zebaro.dev}
      - INIT_PORT=51820
      - INIT_DNS=94.140.14.14,94.140.15.15
      - INIT_IPV4_CIDR=10.0.0.0/24
      - INIT_IPV6_CIDR=fdcc:24::/64
      - DISABLE_IPV6=true
      - HOST=172.17.0.1
      - PORT=51821
      - INSECURE=true
    volumes:
      - ./vpn:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun