name: CI

# CI runs THE SAME command you run locally: scripts/gate.py. That is deliberate — a
# pipeline that re-implements the checks drifts from the local one, and then
# "у меня зелено" and "CI красный" become a regular, unexplainable event.
#
# CD calls this workflow before building the image (workflow_call), so a tag on a red
# commit never reaches the server.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Python first, then Poetry: the other way round Poetry lands on the runner's
      # system interpreter.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # pipx is preinstalled on the runner — one third-party action less.
      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Gate
        run: python scripts/gate.py --strict

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
