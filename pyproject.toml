[tool.poetry]
name = "zebaro-core-bot"
version = "0.13.1"
description = "🤖 Multi-platform automation bot: Telegram & Discord bots, FastAPI webhooks, Docker control, GitHub alerts, job scraping."
authors = ["Zebaro <denok100100@gmail.com>"]
readme = "README.md"
package-mode = false

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------
[tool.poetry.dependencies]
python = ">=3.11,<3.15"

# --- Telegram ---
aiogram = "^3.27"

# --- Discord ---
discord-py = "^2.7"

# --- Config / Settings ---
pydantic-settings = "^2.14"

# --- Database ---
pymongo = "^4.18.2"

# --- Task scheduling ---
apscheduler = "^3.11.3"

# --- Web scraping ---
playwright = "^1.63.0"
playwright-stealth = "^2.0"
beautifulsoup4 = "^4.15.0"

# --- HTTP / Webhooks ---
uvicorn = "^0.54.0"
fastapi = "^0.142.2"
requests = "^2.34.2"
httpx = "^0.28"

# --- Docker management ---
docker = "^7.2.0"

# ---------------------------------------------------------------------------
# Development dependencies
# ---------------------------------------------------------------------------
[tool.poetry.group.dev.dependencies]

# --- Linting & formatting (ruff: formatter, import order, flake8 + bugbear, bandit rules) ---
ruff = "^0.16.10"

# --- Type checking ---
mypy = "^2.4.0"

# --- Testing ---
pytest = "^9.1.1"
pytest-mock = "^3.16.0"
pytest-cov = "^7.1"
pytest-asyncio = "^1.4.0"

# --- Security scanning (code patterns are ruff's S rules) ---
pip-audit = "^2.10.1"

# ===========================================================================
# Tool configuration
# ===========================================================================

# ---------------------------------------------------------------------------
# Ruff — one tool for what black, isort, flake8 (+bugbear) and bandit did
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["mongo_db", "_temp", "_ideas"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes — flake8
    "I",            # import order — isort
    "B",            # bugbear
    "S",            # bandit
    "UP",           # pyupgrade: syntax of the Python we run
    "C4",           # comprehensions
    "SIM",          # simplifications
    "RUF",          # ruff's own
]
ignore = [
    "E203",                       # whitespace before ':' — the formatter's slices
    "RUF001", "RUF002", "RUF003", # Cyrillic letters look like Latin ones: the bot speaks Russian
    "S101",                       # assert — tests and type narrowing
    "S104",                       # binding to 0.0.0.0 inside the container
    "SIM105",                     # contextlib.suppress over try/except/pass: a matter of taste
    "RUF012",                     # list constants on classes (infra_deps): never mutated
    "C408",                       # dict(a=1) where it reads better than a literal
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S", "B011"]
# The gate and the release script run tools by design; job_stats opens a fixed https base; a
# script's cleanup may swallow its own failure.
"scripts/**" = ["S603", "S607", "S310", "S110"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
disable_error_code = ["no-untyped-def", "import-untyped"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--verbose",
    "--color=yes",
    "--strict-markers",
    "--strict-config",
    "--rootdir=."
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning"
]
markers = [
    "asyncio: mark test as asyncio",
    "slow: mark test as slow"
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\b",
    "@(abc\\.)?abstractmethod"
]
